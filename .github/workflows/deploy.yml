name: Build and Deploy (api )

on:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/chrismrkr/traveldiary-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate test RSA keys
        run: |
          mkdir -p src/main/resources/keys
          openssl genpkey -algorithm RSA \
            -out src/main/resources/keys/traveldiary-private_pkcs8.pem \
            -pkeyopt rsa_keygen_bits:2048
          openssl rsa -pubout \
            -in src/main/resources/keys/traveldiary-private_pkcs8.pem \
            -out src/main/resources/keys/traveldiary-public.pem

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build & test
        run: ./gradlew clean build

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: chrismrkr
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      - name: Deploy to cluster via SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "kubectl set image deployment/traveldiary-api api=${{ env.IMAGE }}:${{ github.sha }} -n traveldiary && kubectl rollout status deployment/traveldiary-api -n traveldiary --timeout=120s"
spring:
  application:
    name: traveldiary-api
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create

  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}   # 환경변수로 주입
      chat:
        options:
          model: claude-sonnet-4-5
          max-tokens: 1024
          temperature: 0.7
    openai:
      api-key: ${OPENAI_API_KEY} # 환경변수로 주입
      image:
        options:
          model: dall-e-3


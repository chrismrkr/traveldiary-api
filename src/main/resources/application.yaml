spring:
  application:
    name: traveldiary-api

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create

  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}   # 환경변수로 주입
      chat:
        options:
          model: claude-sonnet-4-5
          max-tokens: 1024
          temperature: 0
    openai:
      api-key: ${OPENAI_API_KEY} # 환경변수로 주입
      image:
        options:
          model: gpt-image-1
          quality: medium
          width: 1024
          height: 1024

app:
  jwt:
    public-key: classpath:keys/traveldiary-public.pem
  idempotency:
    cleanup-interval: PT10M   # 정리 스케줄러 실행 주기
    in-progress-ttl: PT5M     # 중단된 IN_PROGRESS 예약 만료 시간
    completed-ttl: PT24H      # COMPLETED 응답 보관(재생 가능) 시간
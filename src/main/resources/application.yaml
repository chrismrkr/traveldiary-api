server:
  port: 8081

spring:
  application:
    name: traveldiary-api

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create

  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}   # 환경변수로 주입
      chat:
        options:
          model: claude-sonnet-4-5
          max-tokens: 1024
          temperature: 0
    openai:
      api-key: ${OPENAI_API_KEY} # 환경변수로 주입
      image:
        options:
          model: gpt-image-1
          quality: medium
          width: 1024
          height: 1024

app:
  jwt:
    public-key: classpath:keys/traveldiary-public.pem
  idempotency:
    cleanup-interval: PT10M   # 정리 스케줄러 실행 주기
    ttl: PT24H                # 멱등키 보관 시간 (지나면 같은 키로 재요청 가능)
  city:
    image:
      storage-path: ./city-images   # 도시 이미지 저장 루트 (운영은 절대경로 권장)
      cache-ttl: P30D               # 이미지 응답 브라우저 캐시 max-age

---
# 어떤 API 가 호출되어 어떤 SQL 이 나갔는지 추적하기 위한 개발용 로깅.
# 운영에서는 성능 부담과 파라미터 값(개인정보) 노출 때문에 켜지 않는다.
spring:
  config:
    activate:
      on-profile: "!prod"

logging:
  level:
    # 어떤 요청이 들어와 어떤 컨트롤러 메서드로 매핑됐는지
    org.springframework.web.servlet.DispatcherServlet: DEBUG
    org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping: DEBUG
    # 우리 코드(컨트롤러/서비스/어댑터)의 로그
    kko.traveldiary_api: DEBUG